[project]
name = "manual-agent"
version = "0.1.0"
description = "Manual AI Agent for HTTP status codes with Observe-Reason-Act-Evaluate loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
